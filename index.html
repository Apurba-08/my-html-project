<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Go Out With Me? 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe6e9;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
        }

        .card img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .yes-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        .yes-btn:hover {
            background-color: #ff2a54;
            transform: scale(1.08);
        }

        .no-btn {
            background-color: #6c757d;
            color: white;
            position: absolute;
            right: 30px;
        }

        /* Food Menu Styling */
        .menu-title {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .menu-list {
            text-align: left;
            background: #fff0f3;
            padding: 15px 20px;
            border-radius: 12px;
            margin: 15px 0;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #ffb3c1;
            font-size: 16px;
            color: #4a4a4a;
            font-weight: 600;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .price {
            color: #ff4d6d;
            font-weight: bold;
        }

        .success-footer {
            color: #d63384;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <img id="gifImage" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExYm95ZjRpajBvN29tZGhpaXVpc3RuaTkyZTAwazFrMmZ1aHB1cjhiMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/1JmGiBtqTuehfYxuy9/giphy.gif" alt="Cute Cat asking question">
        <h1 id="questionText">Will you go on a date with me? 💖</h1>
        
        <div class="btn-group">
            <button class="yes-btn" onclick="acceptProposal()">Yes 🥰</button>
            <button class="no-btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No 😜</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        // Function to move the "No" button dynamically
        function moveNoButton() {
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Add touchstart event for mobile devices
        noBtn.addEventListener('touchstart', function (e) {
            e.preventDefault();
            moveNoButton();
        });

        // Function when "Yes" is clicked (Shows Kolkata Food Menu in Rupees)
        function acceptProposal() {
            const card = document.getElementById('mainCard');
            card.innerHTML = `
                <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3OHpvNHZ1YW1rMHYzaWV0MnRnejduN28zYW51dWl2MWRlOG1scm50ZSZlcD12MV9naWZzX3RyZW5kaW5nJmN0PWc/IzXiddo2twMmdmU8Lv/giphy.gif" alt="Celebration Cat">
                <h2 class="menu-title">Yayyy! Our Date Menu! 🍽️✨</h2>
                
                <div class="menu-list">
                    <div class="menu-item">
                        <span>🥙 Fuchka & Kolkata Egg Chicken Roll</span>
                        <span class="price">₹100</span>
                    </div>
                    <div class="menu-item">
                        <span>☕ Coffee & Snack</span>
                        <span class="price">₹150</span>
                    </div>
                    <div class="menu-item">
                        <span>🍲 Special Biryani</span>
                        <span class="price">₹280</span>
                    </div>
                    <div class="menu-item">
                        <span>🍧 Ice-cream </span>
                        <span class="price">₹50</span>
                    </div>
                </div>

                <p class="success-footer">সব খরচ তোমার! আর যদি একটা ঠোঁটে চুমু দাও তাহলে... 😁</p>
                <p class="success-footer">সব খরচ আমার! চলো জলদি প্ল্যান করি! 🥰💖</p>
            `;
        }
    </script>
</body>
</html>
