<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Go Out With Me? 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe6e9;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
        }

        .card img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }

        button, .confirm-btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .yes-btn, .confirm-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        .yes-btn:hover, .confirm-btn:hover {
            background-color: #ff2a54;
            transform: scale(1.05);
        }

        .no-btn {
            background-color: #6c757d;
            color: white;
            position: absolute;
            right: 30px;
            z-index: 999;
            touch-action: none;
        }

        /* Food Menu Styling */
        .menu-title {
            color: #d63384;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .menu-list {
            text-align: left;
            background: #fff0f3;
            padding: 12px 18px;
            border-radius: 12px;
            margin: 12px 0;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #ffb3c1;
            font-size: 15px;
            color: #4a4a4a;
            font-weight: 600;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .price {
            color: #ff4d6d;
            font-weight: bold;
        }

        /* Date Picker Section */
        .date-section {
            margin-top: 15px;
            background: #fafafa;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ffe0e6;
        }

        .date-section label {
            display: block;
            color: #d63384;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .date-input {
            padding: 8px 12px;
            border: 2px solid #ff4d6d;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
            width: 100%;
        }

        .final-msg {
            color: #ff4d6d;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }

        /* Flirty Note Card */
        .deal-box {
            background-color: #fff0f3;
            border: 1px dashed #ff4d6d;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            font-size: 14px;
            color: #4a4a4a;
            line-height: 1.5;
        }

        .deal-box strong {
            color: #d63384;
        }

        .reset-btn {
            margin-top: 15px;
            background-color: #6c757d;
            color: white;
            font-size: 12px;
            padding: 6px 15px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            opacity: 0.6;
        }

        .reset-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <!-- Content dynamically handled by JS -->
    </div>

    <script>
        const card = document.getElementById('mainCard');

        // Page load checking logic
        window.addEventListener('DOMContentLoaded', () => {
            const savedDate = localStorage.getItem('selectedDate');
            if (savedDate) {
                showConfirmedScreen(savedDate);
            } else {
                showQuestionScreen();
            }
        });

        // Question Screen Initialization
        function showQuestionScreen() {
            card.innerHTML = `
                <img id="gifImage" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExYm95ZjRpajBvN29tZGhpaXVpc3RuaTkyZTAwazFrMmZ1aHB1cjhiMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/1JmGiBtqTuehfYxuy9/giphy.gif" alt="Cute Cat asking question">
                <h1 id="questionText">Will you go on a date with me? 💖</h1>
                
                <div class="btn-group">
                    <button class="yes-btn" onclick="acceptProposal()">Yes 🥰</button>
                    <button class="no-btn" id="noBtn">No 😜</button>
                </div>
            `;
            attachNoButtonEvents();
        }

        // Attach events to No button for desktop & mobile
        function attachNoButtonEvents() {
            const noBtn = document.getElementById('noBtn');
            if (!noBtn) return;

            const moveNoButton = (e) => {
                if (e) e.preventDefault();
                const padding = 20;
                const maxX = window.innerWidth - noBtn.offsetWidth - padding;
                const maxY = window.innerHeight - noBtn.offsetHeight - padding;

                const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
                const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

                noBtn.style.position = 'fixed';
                noBtn.style.left = `${randomX}px`;
                noBtn.style.top = `${randomY}px`;
            };

            noBtn.addEventListener('mouseover', moveNoButton);
            noBtn.addEventListener('touchstart', moveNoButton, { passive: false });
            noBtn.addEventListener('pointerdown', moveNoButton);
            noBtn.addEventListener('click', moveNoButton);
        }

        // Function when "Yes" is clicked
        function acceptProposal() {
            const today = new Date().toISOString().split('T')[0];

            card.innerHTML = `
                <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3OHpvNHZ1YW1rMHYzaWV0MnRnejduN28zYW51dWl2MWRlOG1scm50ZSZlcD12MV9naWZzX3RyZW5kaW5nJmN0PWc/IzXiddo2twMmdmU8Lv/giphy.gif" alt="Celebration Cat">
                <h2 class="menu-title">Yayyy! Our Date Menu! 🍽️✨</h2>
                
                <div class="menu-list">
                    <div class="menu-item">
                        <span>🥙 Fuchka & Kolkata Egg Chicken Roll</span>
                        <span class="price">₹100</span>
                    </div>
                    <div class="menu-item">
                        <span>☕ Coffee/Tea & Snack</span>
                        <span class="price">₹150</span>
                    </div>
                    <div class="menu-item">
                        <span>🍲 Special Biryani</span>
                        <span class="price">₹280</span>
                    </div>
                    
                    <div class="menu-item">
                        <span>🍧Your favorite Ice-Cream</span>
                        <span class="price">₹60</span>
                    </div>
                </div>

                <div class="date-section" id="dateArea">
                    <label for="datePicker">📅 কোন দিন যাবে তারিখ সিলেক্ট করো:</label>
                    <input type="date" id="datePicker" class="date-input" min="${today}">
                    <button class="confirm-btn" onclick="confirmDate()">Lock the Date! 🔒</button>
                </div>
            `;
        }

        // Function to confirm and save selected date
        function confirmDate() {
            const datePicker = document.getElementById('datePicker');
            const selectedDate = datePicker.value;
            
            if (!selectedDate) {
                alert("প্লিজ একটি তারিখ সিলেক্ট করো! 📅");
                return;
            }

            const dateObj = new Date(selectedDate);
            const formattedDate = dateObj.toLocaleDateString('bn-IN', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            localStorage.setItem('selectedDate', formattedDate);
            showConfirmedScreen(formattedDate);
        }

        // Screen to show when date is fixed
        function showConfirmedScreen(formattedDate) {
            card.innerHTML = `
                <img src="https://media.giphy.com/media/M90mJvfWfd5mbUuULX/giphy.gif" alt="Love Hug GIF">
                <h2 class="menu-title">It's a Date! 🎉💖</h2>
                <p class="final-msg">আমাদের ডেটের তারিখ: <br><strong>${formattedDate}</strong> 🥰</p>
                
                <div class="deal-box">
                    নরমাল ডিল: সব খরচ তোমার! 😜<br>
                    <strong>স্পেশাল ডিল: আর যদি একটা ঠোঁটে চুমু দাও... তাহলে সব খরচ আমার!, তৈরি থেকো! 🍽️✨</strong>
                </div>

                <p style="color: #d63384; font-weight: bold; margin-top: 15px; font-size: 14px;">
                    📸 একটি স্ক্রিনশট (Screenshot) নিয়ে আমাকে পাঠিয়ে দাও!
                </p>
                <button class="reset-btn" onclick="resetDate()">Change Date 🔄</button>
            `;
        }

        // Function to reset saved date if needed
        function resetDate() {
            localStorage.removeItem('selectedDate');
            showQuestionScreen();
        }
    </script>
</body>
</html>
